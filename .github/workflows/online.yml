name: Online room integrity
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'online.js'
      - 'scripts/build-online-engine.cjs'
      - 'tests/online-v027.mjs'
      - 'tests/online-bots.mjs'
      - 'bot-brain.js'
      - 'tests/bots-levels.cjs'
      - 'scripts/bot-sim.cjs'
      - 'city-market-v024.js'
      - '.github/workflows/online.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: node scripts/build-online-engine.cjs
      - run: node tests/online-v027.mjs
      - run: node tests/online-bots.mjs
      - run: node tests/bots-levels.cjs
      - run: node tests/renewal-v026.cjs
