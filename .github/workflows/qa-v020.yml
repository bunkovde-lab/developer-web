name: QA v0.20 strategic economics research
on:
  pull_request:
    paths:
      - 'tests/qa-v020-strategies.cjs'
      - '.github/workflows/qa-v020.yml'
      - 'docs/qa/v020/**'
  workflow_dispatch:
jobs:
  policy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [control, mixed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute 40 policy smoke campaigns
        env:
          QA_GAMES: 40
          QA_POLICY_MODE: ${{ matrix.mode }}
          QA_REPORT_DIR: qa-results/smoke-${{ matrix.mode }}
        run: node tests/qa-v020-strategies.cjs
  policy-research:
    needs: policy-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [control, mixed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute 1000 deterministic 3-to-6-player games
        env:
          QA_GAMES: 1000
          QA_POLICY_MODE: ${{ matrix.mode }}
          QA_REPORT_DIR: qa-results/full-${{ matrix.mode }}
        run: node tests/qa-v020-strategies.cjs
      - name: Upload complete replay records and scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-v020-${{ matrix.mode }}-1000
          path: qa-results/full-${{ matrix.mode }}/
          if-no-files-found: warn
