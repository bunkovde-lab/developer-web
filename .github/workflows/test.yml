name: Browser game regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Game mechanics and syntax smoke tests
        run: node tests/smoke.cjs
      - name: Spatial map, explicit land auction and development rules
        run: node tests/territory.cjs
      - name: Unlimited finite cards and city request sales
        run: node tests/city-requests.cjs
      - name: Accelerated game pacing benchmark
        run: node tests/pace.cjs
