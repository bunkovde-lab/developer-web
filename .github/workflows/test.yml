name: Browser game regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserved mechanics and modular architecture
        run: node tests/feature-contract.cjs && node tests/architecture.cjs
      - name: Game mechanics and syntax smoke tests
        run: node tests/smoke.cjs
      - name: Spatial map, explicit land auction and development rules
        run: node tests/territory.cjs
      - name: Unlimited finite cards and city request sales
        run: node tests/city-requests.cjs
      - name: Accelerated game pacing benchmark
        run: node tests/pace.cjs
      - name: V0.16 gameplay, sealed auctions and alternate ending
        run: node tests/rework.cjs
      - name: V0.16 sixteen complete deterministic campaigns
        run: node tests/tournament-v016.cjs
      - name: QA 1000 deterministic full economic campaigns (3–6 players)
        timeout-minutes: 20
        run: QA_GAMES=1000 node tests/qa-mass-campaigns.cjs
      - name: SVG manifest and safe vector asset validation
        run: node tests/svg-assets.cjs
      - name: Finance integrity and persistent save roundtrip
        run: node tests/finance-integrity.cjs
