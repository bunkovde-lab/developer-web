name: Publish Developer Online
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'portal/**'
      - 'scripts/build-site.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: developer-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current rules and assets
        run: |
          node tests/renewal-v026.cjs
          node tests/svg-assets.cjs
          node tests/atelier-presentation.cjs
          node tests/portal.mjs
      - name: Build online client
        run: node scripts/build-site.cjs --out site
      - name: Preserve historic reference builds
        shell: bash
        run: |
          set -euo pipefail
          for item in 'v018:7ece96d3315a2e5698c086122f356b7209fc658a' 'v0181-rc1:0a6c0f1bcc95ac628ffd9a2e355addcca8973f53' 'v019:7f22188a37be4dbad5e4b181d381894bec115e7c' 'v020-qa:f91ac3102eb6796a72f216aca443dc964082824e'; do
            name="${item%%:*}"
            sha="${item#*:}"
            git fetch --no-tags --depth=1 origin "$sha"
            legacy="$(mktemp -d)"
            git archive "$sha" | tar -x -C "$legacy"
            (cd "$legacy" && GITHUB_SHA="$sha" node scripts/build-site.cjs --out dist)
            mkdir -p "site/previews/$name"
            cp -R "$legacy/dist/." "site/previews/$name/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
