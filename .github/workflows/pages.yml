name: Publish Developer Web
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'balance.js'
      - 'marketplace.js'
      - 'city-requests.js'
      - 'auction-competition.js'
      - 'pace.js'
      - 'visual.js'
      - 'visual.css'
      - 'scene-motion.js'
      - 'scene-motion.css'
      - 'game-rework-v016.js'
      - 'assets/**'
      - 'game/**'
      - 'styles/**'
      - 'ui/**'
      - 'scripts/build-site.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: developer-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build pinned stable/rc1 and isolated v0.19 preview
        shell: bash
        run: |
          set -euo pipefail
          # Last verified v0.18 stable source, deliberately unchanged by RC review.
          stable_sha="7ece96d3315a2e5698c086122f356b7209fc658a"
          git fetch --no-tags --depth=1 origin "$stable_sha"
          stable="$(mktemp -d)"
          git archive "$stable_sha" | tar -x -C "$stable"
          (
            cd "$stable"
            GITHUB_SHA="$stable_sha" node scripts/build-site.cjs --out dist
          )
          mkdir -p site
          cp -R "$stable/dist/." site/

          # Preserve the previously integrated RC1 exactly; v0.19 owns a separate save slot.
          rc1_sha="c86df7daac15172fcea3afdc2a94a7ca0265b468"
          git fetch --no-tags --depth=1 origin "$rc1_sha"
          rc1="$(mktemp -d)"
          git archive "$rc1_sha" | tar -x -C "$rc1"
          (cd "$rc1"; GITHUB_SHA="$rc1_sha" PR_NUMBER=15 node scripts/build-site.cjs --out dist)
          mkdir -p site/previews/v0181-rc1
          cp -R "$rc1/dist/." site/previews/v0181-rc1/

          GITHUB_SHA="$GITHUB_SHA" node scripts/build-site.cjs --out dist
          grep -q 'v0.19-test' dist/index.html
          test -f dist/game/runtime.js
          mkdir -p site/previews/v019
          cp -R dist/. site/previews/v019/

          # Maintain the old preview address for existing Android feedback.
          mkdir -p site/previews/v018
          cp -R "$stable/dist/." site/previews/v018/
          cat >site/previews/v0181-rc1/RC1_SOURCE.json <<EOF
          {
            "release": "v0.18.1-rc1",
            "status": "TEST ONLY - not stable",
            "source_sha": "$rc1_sha",
            "stable_source_sha": "$stable_sha",
            "preview_path": "/developer-web/previews/v0181-rc1/"
          }
          EOF
          touch site/.nojekyll
          echo "Stable root from $stable_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "RC1 preview: $rc1_sha at https://bunkovde-lab.github.io/developer-web/previews/v0181-rc1/" >> "$GITHUB_STEP_SUMMARY"
          echo "v0.19 test: $GITHUB_SHA at https://bunkovde-lab.github.io/developer-web/previews/v019/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
