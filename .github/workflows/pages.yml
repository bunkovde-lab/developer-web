name: Publish Developer Web
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'balance.js'
      - 'marketplace.js'
      - 'city-requests.js'
      - 'auction-competition.js'
      - 'pace.js'
      - 'visual.js'
      - 'visual.css'
      - 'scene-motion.js'
      - 'scene-motion.css'
      - 'game-rework-v016.js'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: developer-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      # Publish visual fix PR #11 as a test-only subdirectory; never replace stable
      # root game or merge experimental gameplay into main for this preview.
      - name: Assemble independent v0.18 SVG fix preview from PR #11
        shell: bash
        run: |
          set -euo pipefail
          preview_sha="$(git ls-remote origin refs/pull/11/head | awk '{print $1}')"
          if [[ ! "$preview_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR #11 head cannot be resolved" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$preview_sha"
          staging="$(mktemp -d)"
          git archive FETCH_HEAD | tar -x -C "$staging"
          mkdir -p "$staging/scripts"
          cp scripts/build-site.cjs "$staging/scripts/build-site.cjs"
          (
            cd "$staging"
            GITHUB_SHA="$preview_sha" PR_NUMBER=11 node scripts/build-site.cjs --out dist
          )
          mkdir -p previews/v018
          cp -R "$staging/dist/." previews/v018/
          printf 'Preview of PR #11, source commit %s\n' "$preview_sha" >> "$GITHUB_STEP_SUMMARY"
          test -f previews/v018/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
