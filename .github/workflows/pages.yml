name: Publish Developer Web
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'balance.js'
      - 'marketplace.js'
      - 'city-requests.js'
      - 'auction-competition.js'
      - 'pace.js'
      - 'visual.js'
      - 'visual.css'
      - 'scene-motion.js'
      - 'scene-motion.css'
      - 'game-rework-v016.js'
      - 'assets/**'
      - 'scripts/build-site.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: developer-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build stable release and isolated v0.18.1-rc1 preview
        shell: bash
        run: |
          set -euo pipefail
          # Last verified v0.18 stable source, deliberately unchanged by RC review.
          stable_sha="7ece96d3315a2e5698c086122f356b7209fc658a"
          git fetch --no-tags --depth=1 origin "$stable_sha"
          stable="$(mktemp -d)"
          git archive "$stable_sha" | tar -x -C "$stable"
          (
            cd "$stable"
            GITHUB_SHA="$stable_sha" node scripts/build-site.cjs --out dist
          )
          mkdir -p site
          cp -R "$stable/dist/." site/

          # GitHub Pages shares an origin across paths; testers must use a
          # private browser profile to avoid mixing v0.18 save slots with rc1.
          GITHUB_SHA="$GITHUB_SHA" PR_NUMBER=15 node scripts/build-site.cjs --out dist
          test -f dist/scene-motion.js
          test -f dist/tests/browser_rc1_stability.cjs || test -f tests/browser_rc1_stability.cjs
          test "$(node -p "require('./assets/svg/manifest.json').version")" = 1
          grep -q 'v0.18.1-rc1' dist/index.html
          mkdir -p site/previews/v0181-rc1
          cp -R dist/. site/previews/v0181-rc1/

          # Maintain the old preview address for existing Android feedback.
          mkdir -p site/previews/v018
          cp -R "$stable/dist/." site/previews/v018/
          cat >site/previews/v0181-rc1/RC1_SOURCE.json <<EOF
          {
            "release": "v0.18.1-rc1",
            "status": "TEST ONLY - not stable",
            "source_sha": "$GITHUB_SHA",
            "stable_source_sha": "$stable_sha",
            "preview_path": "/developer-web/previews/v0181-rc1/"
          }
          EOF
          touch site/.nojekyll
          echo "Stable root from $stable_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "RC1 preview: $GITHUB_SHA at https://bunkovde-lab.github.io/developer-web/previews/v0181-rc1/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
