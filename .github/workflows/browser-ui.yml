name: Marketplace browser UI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'balance.js'
      - 'marketplace.js'
      - 'city-requests.js'
      - 'auction-competition.js'
      - 'visual.js'
      - 'visual.css'
      - 'scene-motion.js'
      - 'scene-motion.css'
      - 'pace.js'
      - 'game-rework-v016.js'
      - 'assets/**'
      - 'tests/svg-assets.cjs'
      - 'tests/browser_visual.cjs'
      - 'tests/browser_territory.cjs'
      - 'tests/browser_finance.cjs'
      - 'tests/browser_living_city.cjs'
      - 'tests/browser_work_integration.cjs'
      - 'tests/browser_rc1_stability.cjs'
      - 'tests/browser_marketplace.cjs'
      - 'tests/browser_city_requests.cjs'
      - '.github/workflows/browser-ui.yml'
  pull_request:
  workflow_dispatch:
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile marketplace browser test
        run: node tests/browser_marketplace.cjs
      - name: City request and land-card barter browser flow
        run: node tests/browser_city_requests.cjs
      - name: Responsive visual and audio UI
        run: node tests/browser_visual.cjs
      - name: Deterministic land market and territorial tactics UI
        run: node tests/browser_territory.cjs
      - name: Financial integrity and save/load browser flow
        run: node tests/browser_finance.cjs
      - name: Living city SVG, animation controls, accessibility and performance
        run: node tests/browser_living_city.cjs
      - name: Work integration metadata, zoom stacking, touch and missing SVG regression
        run: node tests/browser_work_integration.cjs
      - name: RC1 stale timers, storage failures and full browser campaigns
        run: node tests/browser_rc1_stability.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-v010-screenshots
          path: ui-snapshots/*.png
          if-no-files-found: ignore
