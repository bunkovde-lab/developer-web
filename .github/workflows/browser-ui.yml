name: Marketplace browser UI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'balance.js'
      - 'marketplace.js'
      - 'visual.js'
      - 'visual.css'
      - 'pace.js'
      - 'tests/browser_visual.cjs'
      - 'tests/browser_marketplace.cjs'
      - '.github/workflows/browser-ui.yml'
  pull_request:
  workflow_dispatch:
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile marketplace browser test
        run: node tests/browser_marketplace.cjs
      - name: Responsive visual and audio UI
        run: node tests/browser_visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-v010-screenshots
          path: ui-snapshots/*.png
          if-no-files-found: ignore
