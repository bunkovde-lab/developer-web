name: Marketplace browser UI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'balance.js'
      - 'marketplace.js'
      - 'city-requests.js'
      - 'auction-competition.js'
      - 'visual.js'
      - 'visual.css'
      - 'scene-motion.js'
      - 'scene-motion.css'
      - 'board-geometry.css'
      - 'trade-context.css'
      - 'tests/browser_trade_context.cjs'
      - 'tests/browser_market_board.cjs'
      - 'pace.js'
      - 'game-rework-v016.js'
      - 'assets/**'
      - 'tests/svg-assets.cjs'
      - 'tests/browser_visual.cjs'
      - 'tests/browser_territory.cjs'
      - 'tests/browser_finance.cjs'
      - 'tests/browser_living_city.cjs'
      - 'tests/browser_work_integration.cjs'
      - 'tests/browser_rc1_stability.cjs'
      - 'tests/browser_smooth_tokens.cjs'
      - 'tests/browser_arrival_events.cjs'
      - 'tests/browser_qa_work_cards.cjs'
      - 'work-economy-v020.js'
      - 'tests/browser_rectangular_geometry.cjs'
      - 'tests/browser_marketplace.cjs'
      - 'tests/browser_city_requests.cjs'
      - '.github/workflows/browser-ui.yml'
  pull_request:
  workflow_dispatch:
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture pinned pre-design baseline for before-after comparison
        shell: bash
        run: |
          baseline="$(mktemp -d)"
          git fetch --depth=1 origin f91ac3102eb6796a72f216aca443dc964082824e
          git archive f91ac3102eb6796a72f216aca443dc964082824e | tar -x -C "$baseline"
          (cd "$baseline" && NODE_PATH="$GITHUB_WORKSPACE/node_modules" node tests/browser_rectangular_geometry.cjs)
          mkdir -p ui-snapshots/before
          cp "$baseline"/ui-snapshots/*.png ui-snapshots/before/
      - name: Card geometry, engraved menu and compact land card
        run: node tests/browser_card_polish.cjs
      - name: Face-down card flight, reveal and destination decks
        run: node tests/browser_card_flight.cjs
      - name: Numbered card library, visible deck shelf, reference privacy and tax cell 11
        run: node tests/browser_card_library.cjs
      - name: Premium design, non-mutation, responsive screens and live city fixture
        run: node tests/browser_premium.cjs
      - name: Final 11x7 board geometry, every touch target, 5 devices and before-after screenshots
        run: node tests/browser_rectangular_geometry.cjs
      - name: Run mobile marketplace browser test
        run: node tests/browser_marketplace.cjs
      - name: Live-board auction and Deal close across five touchscreen viewports
        run: node tests/browser_trade_context.cjs
      - name: Live strategic map beside card trading workstation
        run: node tests/browser_market_board.cjs
      - name: City request and land-card barter browser flow
        run: node tests/browser_city_requests.cjs
      - name: Responsive visual and audio UI
        run: node tests/browser_visual.cjs
      - name: Deterministic land market and territorial tactics UI
        run: node tests/browser_territory.cjs
      - name: Financial integrity and save/load browser flow
        run: node tests/browser_finance.cjs
      - name: Living city SVG, animation controls, accessibility and performance
        run: node tests/browser_living_city.cjs
      - name: Work integration metadata, zoom stacking, touch and missing SVG regression
        run: node tests/browser_work_integration.cjs
      - name: RC1 stale timers, storage failures and full browser campaigns
        run: node tests/browser_rc1_stability.cjs
      - name: Smooth player pawns across all real track squares and accessibility modes
        run: node tests/browser_smooth_tokens.cjs
      - name: Landing event cards and auctions only after the pawn arrives
        run: node tests/browser_arrival_events.cjs
      - name: Four-player Work cards, liquidity obligations and restored decks
        run: node tests/browser_qa_work_cards.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-v010-screenshots
          path: ui-snapshots/
          if-no-files-found: ignore
