<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Девелопер — браузерная версия</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#0d182a;color:#f0f5ff;margin:0}header{padding:18px;background:#152642;border-bottom:2px solid #d6a85c}h1{margin:0;color:#ffdc92;font-size:25px}small{color:#aebed4}.wrap{max-width:1050px;margin:auto;padding:12px}.stats,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill,.panel{background:#1b304c;border:1px solid #395477;border-radius:12px;padding:10px}.pill{flex:1;min-width:110px}button,select{border:0;border-radius:9px;background:#e0b568;color:#172439;padding:11px;font-weight:800;cursor:pointer}button:disabled{opacity:.4}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:14px 0}.cell{min-height:95px;border:2px solid #355070;border-radius:10px;padding:6px;background:linear-gradient(145deg,#224462,#192d47);font-size:11px;position:relative}.cell.owned{border-color:#ddbc75}.cell.active{box-shadow:0 0 0 2px #ffd275 inset}.cell b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell span{color:#ffd58a}.tokens{position:absolute;bottom:4px;display:flex;gap:3px;flex-wrap:wrap}.token{width:15px;height:15px;border-radius:50%;border:1px solid white}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}#log{max-height:220px;overflow:auto;font-size:13px;line-height:1.55}#players{font-size:14px;line-height:1.8} .muted{color:#a7bfd9}@media(max-width:650px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}.cell{min-height:88px}.cols{grid-template-columns:1fr}}</style></head>
<body><header><h1>🏙️ ДЕВЕЛОПЕР</h1><small>HTML · отдельная тестовая ветка · локальная игра с ботами</small></header><main class="wrap">
<div class="stats"><div class="pill">Раунд: <b id="round">1</b></div><div class="pill">Ход: <b id="who">—</b></div><div class="pill">Капитал: <b id="money">—</b></div><div class="pill">Бросок: <b id="dice">—</b></div></div>
<div class="actions"><label class="pill">Участники <select id="count"><option>3</option><option>4</option><option>5</option><option>6</option></select></label><button onclick="newGame()">Новая партия</button><button onclick="roll()" id="roll">🎲 Бросить кубик</button><button onclick="buy()" id="buy">Купить участок</button><button onclick="build()" id="build">🏗️ Построить</button><button onclick="loan()" id="loan">Кредит +300</button><button onclick="sell()" id="sell">Продать объект</button><button onclick="endTurn()" id="end">Завершить ход</button><button onclick="save()">Сохранить</button><button onclick="load()">Загрузить</button></div>
<div class="board" id="board"></div><div class="cols"><section class="panel"><h3>Компании</h3><div id="players"></div><p class="muted">Покупка земли, строительство, кредиты и доходы от аренды — упрощённая модель для тестирования интерфейса.</p></section><section class="panel"><h3>События партии</h3><div id="log"></div></section></div>
</main><script>
const names=['Старт','Центр','Набережная','Промзона','Парк','Север','Вокзал','Заречье','Рынок','Университет','Стадион','Южный','Площадь','Запад','Сити','Лесная','Восток','Порт','Озёрная','Бульвар','Деловая','Высоты','Технопарк','Аэропорт'];const colors=['#f1bf65','#68d9b5','#e77ca6','#82aefe','#c48ff4','#ff846d'];let state;const $=id=>document.getElementById(id);function note(t){state.logs.unshift(t);state.logs=state.logs.slice(0,24)}function newGame(){let n=+$('count').value;state={round:1,turn:0,rolled:false,dice:'—',players:Array.from({length:n},(_,i)=>({name:i?'Бот '+i:'Вы',bot:i>0,money:1500,debt:0,pos:0})),plots:names.map((name,i)=>({name,price:200+(i%8)*55,owner:-1,level:0})),logs:[]};note('Новая партия: '+n+' участников');render()}function current(){return state.players[state.turn]}function roll(){if(state.rolled)return;let p=current();let d=1+Math.floor(Math.random()*6);p.pos=(p.pos+d)%24;state.dice=d;state.rolled=true;let plot=state.plots[p.pos];note(p.name+': 🎲 '+d+' → '+plot.name);if(p.pos===0){p.money+=250;note(p.name+' получил 250 за круг')}if(plot.owner>=0&&plot.owner!==state.turn){let rent=plot.price*.08*(1+plot.level*2)|0;let paid=Math.min(Math.max(p.money,0),rent);p.money-=paid;state.players[plot.owner].money+=paid;note('Аренда: '+paid+' → '+state.players[plot.owner].name)}if(Math.random()<.18){let delta=Math.random()<.5?-100:120;p.money+=delta;note('Рыночное событие: '+(delta>0?'+':'')+delta)}render()}function buy(){let p=current(),x=state.plots[p.pos];if(state.rolled&&p.pos!==0&&x.owner<0&&p.money>=x.price){p.money-=x.price;x.owner=state.turn;note(p.name+' купил '+x.name+' за '+x.price)}render()}function build(){let p=current(),x=state.plots[p.pos],cost=250+x.level*180;if(state.rolled&&x.owner===state.turn&&x.level<3&&p.money>=cost){p.money-=cost;x.level++;note(p.name+' построил уровень '+x.level+' за '+cost)}render()}function loan(){let p=current();if(p.debt<900){p.money+=300;p.debt+=300;note(p.name+' получил кредит 300')}render()}function sell(){let p=current(),x=state.plots[p.pos];if(state.rolled&&x.owner===state.turn){let val=x.price+250*x.level;p.money+=val;x.owner=-1;x.level=0;note(p.name+' продал объект за '+val)}render()}function endTurn(){if(!state.rolled)return;state.turn++;if(state.turn>=state.players.length){state.turn=0;state.round++;state.players.forEach((p,i)=>{let income=state.plots.filter(x=>x.owner===i).reduce((s,x)=>s+35*x.level,0);p.money+=income-Math.floor(p.debt*.05);if(income)note(p.name+' получил доход '+income)})}state.rolled=false;state.dice='—';render();if(current().bot)setTimeout(bot,450)}function bot(){if(!current().bot)return;roll();let p=current(),x=state.plots[p.pos];if(x.owner<0&&p.money>x.price+200)buy();else if(x.owner===state.turn&&p.money>500)build();if(p.money<200&&p.debt<900)loan();setTimeout(endTurn,350)}function value(i){let p=state.players[i];return p.money-p.debt+state.plots.filter(x=>x.owner===i).reduce((s,x)=>s+x.price+250*x.level,0)}function render(){let p=current();$('round').textContent=state.round;$('who').textContent=p.name;$('money').textContent=p.money;$('dice').textContent=state.dice;$('board').innerHTML=state.plots.map((x,i)=>'<div class="cell '+(x.owner>=0?'owned ':'')+(p.pos===i?'active':'')+'"><b>'+(i+1)+'. '+x.name+'</b><span>'+(i===0?'Бонус +250':x.price+' 💰')+'</span><br>'+(x.owner>=0?'🏠 '+state.players[x.owner].name+' · '+x.level+' ур.':'Свободно')+'<div class="tokens">'+state.players.map((u,k)=>u.pos===i?'<i class="token" style="background:'+colors[k]+'"></i>':'').join('')+'</div></div>').join('');$('players').innerHTML=state.players.map((u,i)=>'<div><span style="color:'+colors[i]+'">●</span> <b>'+u.name+'</b>: '+u.money+' 💰 · долг '+u.debt+' · активы '+value(i)+'</div>').join('');$('log').innerHTML=state.logs.map(t=>'<div>• '+t+'</div>').join('');$('roll').disabled=state.rolled||p.bot;$('end').disabled=!state.rolled||p.bot;let x=state.plots[p.pos];$('buy').disabled=!state.rolled||p.bot||p.pos===0||x.owner>=0||p.money<x.price;$('build').disabled=!state.rolled||p.bot||x.owner!==state.turn||x.level>=3||p.money<250+x.level*180;$('sell').disabled=!state.rolled||p.bot||x.owner!==state.turn;$('loan').disabled=p.bot||p.debt>=900}function save(){localStorage.setItem('developer-html-save',JSON.stringify(state));note('Партия сохранена на этом устройстве');render()}function load(){let s=localStorage.getItem('developer-html-save');if(!s)return alert('Нет сохранения');try{state=JSON.parse(s);note('Партия загружена');render();if(current().bot)setTimeout(bot,450)}catch(e){alert('Ошибка сохранения')}}newGame();
</script></body></html>
